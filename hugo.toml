baseURL = 'https://Abysswalker19.github.io/'
languageCode = 'zh-cn'
title = 'Abysswalker的个人博客'
theme = "PaperMod"

# 网站设置
paginate = 5
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true

# 菜单设置
[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 10
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 20
  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 40

# PaperMod主题设置
[params]
  env = "production"
  title = "Abysswalker的个人博客"
  description = "分享技术、记录生活"
  author = "Abysswalker"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.homeInfoParams]
    Title = "👋 欢迎来到我的博客"
    Content = "记录技术学习与生活感悟的地方"

  [params.socialIcons]
    [[params.socialIcons]]
      name = "github"
      url = "https://github.com/Abysswalker19"
    [[params.socialIcons]]
      name = "email"
      url = "mailto:your.email@example.com"

  [params.analytics]
    google = ""

# 分类法设置
[taxonomies]
  category = "categories"
  tag = "tags"

# 标记设置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "github"
