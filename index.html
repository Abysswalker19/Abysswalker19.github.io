<!-- 引入 Sakana Widget 的 CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sakana-widget@2.7.1/lib/sakana.min.css" />



<!-- 在 body 末尾插入挂载点和 JS -->
<div id="sakana-widget" style="position: fixed; right: 24px; bottom: 24px; z-index: 9999;"></div>
<script>
  function initSakanaWidget() {
    new SakanaWidget().mount('#sakana-widget');
  }
</script>
<script
  async
  onload="initSakanaWidget()"
  src="https://cdn.jsdelivr.net/npm/sakana-widget@2.7.1/lib/sakana.min.js"
></script>
