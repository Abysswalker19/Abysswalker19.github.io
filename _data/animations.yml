# 鼠标动画配置
mouse_effects:
  cursor_follower:
    enabled: true
    size: 20
    color: "rgba(255, 255, 255, 0.8)"
    hover_scale: 2
    
  mouse_trail:
    enabled: true
    color: "#ff6b6b"
    size: 4
    duration: 1000
    
  ripple_effect:
    enabled: true
    color: "rgba(255, 255, 255, 0.3)"
    max_size: 300
    duration: 600
    
  link_hover:
    enabled: true
    underline_color: "currentColor"
    underline_height: 2
    transition_duration: 0.3 